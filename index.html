<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#f8fafc">
<title>Thời khóa biểu · Cao đẳng Y tế Hà Tĩnh</title>
<style>
:root {
  color-scheme: light;
  --bg: #f8fafc;
  --surface: #ffffff;
  --text-main: #1e293b;
  --text-muted: #64748b;
  --text-light: #94a3b8;
  --primary: #3b82f6;
  --primary-bg: #eff6ff;
  --line: #e2e8f0;
  --radius-md: 12px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.05);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--bg);
  color: var(--text-main);
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}

.wrap {
  max-width: 760px;
  margin: 0 auto;
  padding: 24px 16px 64px;
}

/* ===== HEADER ===== */
.hero { margin-bottom: 24px; }
.hero h1 {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin: 0 0 6px;
  color: #0f172a;
}
.sub { color: var(--text-muted); font-size: 14px; margin: 0 0 16px; }
.status {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line);
  font-size: 12px; font-weight: 500; color: var(--text-muted);
  box-shadow: var(--shadow-sm);
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; }
.dot.bad { background: #ef4444; }
.spinner {
  display: inline-block; width: 12px; height: 12px;
  border: 2px solid #e2e8f0; border-top-color: var(--primary);
  border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== CONTROL PANEL ===== */
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 16px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 24px;
}
.toolbar {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.field label {
  display: block; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--text-muted); margin-bottom: 6px;
}
.field input {
  width: 100%; background: var(--bg); color: var(--text-main);
  border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; font-size: 14px; outline: none; transition: 0.2s;
  font-family: inherit;
}
.field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-bg); }
button {
  border: none; border-radius: 8px; padding: 10px 16px;
  font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s;
  font-family: inherit;
}
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: #2563eb; }
.btn-secondary { background: var(--bg); color: var(--text-main); border: 1px solid var(--line); }
.btn-secondary:hover { background: #f1f5f9; }
button:disabled { opacity: 0.6; cursor: not-allowed; }

.actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }

.notice {
  margin-top: 16px; padding: 12px; border-radius: 8px;
  font-size: 13px; background: var(--primary-bg); color: #1d4ed8;
  border: 1px solid #bfdbfe; display: flex; align-items: flex-start; gap: 8px;
}
.notice::before { content: "💡"; font-size: 14px; }
.notice.error { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
.notice.error::before { content: "⚠️"; }

/* ===== SECTION HEAD ===== */
.section-head {
  display: flex; justify-content: space-between; align-items: flex-end;
  margin-bottom: 16px; padding: 0 4px;
}
.section-head h2 { font-size: 18px; font-weight: 700; margin: 0; color: #0f172a; }
.count { font-size: 13px; color: var(--text-muted); font-weight: 500; }

.week-nav { display: flex; gap: 8px; margin-top: 12px; }
.week-nav button { flex: 1; padding: 8px; font-size: 13px; }
.week-label {
  text-align: center; font-weight: 700; font-size: 14px;
  padding: 8px 0; color: var(--text-main);
}

/* ===== TIMELINE LIST ===== */
.days { display: flex; flex-direction: column; gap: 32px; }

.day-group { position: relative; }
.day-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 12px; padding-left: 4px;
}
.day-title {
  font-size: 15px; font-weight: 800; color: #0f172a;
  display: flex; align-items: center; gap: 8px;
}
.day-title::before {
  content: ""; display: block; width: 4px; height: 16px;
  background: var(--primary); border-radius: 4px;
}
.day-date { font-size: 13px; font-weight: 600; color: var(--text-muted); }

.day-items {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm);
}

.item {
  display: flex; gap: 16px; padding: 16px;
  border-bottom: 1px solid var(--line); position: relative;
  transition: background 0.2s;
}
.item:last-child { border-bottom: none; }
.item:hover { background: #f8fafc; }

/* Cột thời gian (bên trái) */
.item-time {
  flex: 0 0 70px; display: flex; flex-direction: column; gap: 4px;
  border-right: 1px solid var(--line); padding-right: 12px;
}
.item-session { font-size: 13px; font-weight: 800; color: var(--primary); text-transform: uppercase; }
.item-periods { font-size: 12px; font-weight: 600; color: var(--text-muted); }

/* Cột nội dung (bên phải) */
.item-content { flex: 1; min-width: 0; }
.item-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
.item-subject { font-size: 15px; font-weight: 700; color: var(--text-main); line-height: 1.3; }
.item-class {
  flex-shrink: 0; background: var(--primary-bg); color: var(--primary);
  font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 6px;
}
.item-details { font-size: 13px; color: var(--text-muted); display: flex; flex-direction: column; gap: 2px; }
.item-details span { display: block; }

/* Highlight cho lớp ưu tiên */
.item.priority { background: #f0fdf4; }
.item.priority .item-session { color: #059669; }
.item.priority .item-class { background: #d1fae5; color: #047857; }

/* Empty state */
.empty {
  text-align: center; padding: 48px 24px; background: var(--surface);
  border: 1px dashed var(--line); border-radius: var(--radius-lg);
}
.empty strong { display: block; font-size: 16px; color: var(--text-main); margin-bottom: 4px; }

/* Footer */
.foot { text-align: center; font-size: 12px; color: var(--text-light); margin-top: 40px; }

/* ===== RESPONSIVE CHO MOBILE ===== */
@media (max-width: 600px) {
  .wrap { padding: 16px 12px 48px; }
  .hero h1 { font-size: 24px; }
  .toolbar { grid-template-columns: 1fr; }
  .actions-grid { grid-template-columns: 1fr; }
  .item { padding: 14px 12px; gap: 12px; }
  .item-time { flex: 0 0 60px; }
  .item-subject { font-size: 14px; }
}
</style>
</head>
<body>
<main class="wrap">

<header class="hero">
  <h1>Thời khóa biểu</h1>
  <p class="sub">Cao đẳng Y tế Hà Tĩnh · Tra cứu & đồng bộ</p>
  <div class="status" role="status">
    <span class="dot" id="dot"></span><span id="status">Sẵn sàng kết nối</span>
  </div>
</header>

<section class="panel">
  <div class="toolbar">
    <div class="field">
      <label for="date">Chọn ngày trong tuần</label>
      <input id="date" type="date" value="2026-11-06">
    </div>
    <div class="field">
      <label for="filter">Tìm Lớp / Môn / Giảng viên</label>
      <input id="filter" value="19D" placeholder="VD: 19D hoặc tên môn">
    </div>
  </div>
  
  <div class="actions-grid">
    <button id="load" class="btn-primary">Tải thời khóa biểu</button>
    <button id="auto" class="btn-secondary">Tự cập nhật: BẬT</button>
  </div>

  <div class="notice" id="notice">Hệ thống đang chuẩn bị dữ liệu...</div>
</section>

<div class="section-head">
  <h2>Lịch học</h2>
  <div class="count" id="count">Đang tải...</div>
</div>
<div class="week-nav" style="margin-bottom: 24px;">
  <button class="btn-secondary" id="prev">← Tuần trước</button>
  <div class="week-label" id="weekLabel">06/11/2026</div>
  <button class="btn-secondary" id="next">Tuần sau →</button>
</div>

<section class="days" id="results" aria-live="polite">
  <div class="empty"><strong>Đang kết nối</strong>Đang lấy dữ liệu thời khóa biểu…</div>
</section>

<footer class="foot">
  Dữ liệu được tự động đồng bộ từ cổng Phòng Đào tạo.
</footer>

</main>

<script>
(()=>{'use strict';
const ORIGIN='https://phongdaotao.cdytehatinh.edu.vn';
const $=id=>document.getElementById(id);let rows=[],busy=false,autoOn=true,timer=null,lastRaw=[];
const clean=v=>(v??'').toString().replace(/\s+/g,' ').trim();
const norm=v=>clean(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase();
const fmtDate=v=>{const [y,m,d]=v.split('-');return `${d}/${m}/${y}`};
const getSchoolConfig=date=>{const d=new Date(date+'T12:00:00'),y=d.getFullYear(),m=d.getMonth()+1,start=m>=8?y:y-1;return{schoolYear:`${start} - ${start+1}`,semester:m>=8?1:2}};
const addDays=(date,n)=>{const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const monday=date=>{const d=new Date(date+'T12:00:00'),day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
async function getSnapshot(weekStart){
  const url=`./data/week-${weekStart}.json?v=${Date.now()}`;
  let response;
  try{response=await fetch(url,{cache:'no-store'})}catch(e){throw new Error('Không tải được dữ liệu JSON. Kiểm tra kết nối mạng.')}
  if(!response.ok)throw Object.assign(new Error(`Chưa có dữ liệu cho tuần ${fmtDate(weekStart)} (HTTP ${response.status}).`),{status:response.status});
  const snapshot=await response.json();
  if(!snapshot||snapshot.ok!==true)throw new Error(snapshot?.error||'File dữ liệu lịch học chưa hợp lệ.');
  return snapshot;
}
function findRows(data){if(Array.isArray(data)){if(data.some(x=>x&&typeof x==='object'&&('subjectName'in x||'className'in x||'startPeriod'in x)))return data;for(const x of data){const r=findRows(x);if(r.length)return r}return []}if(data&&typeof data==='object'){for(const k of ['items','data','results','schedules','generalSchedules','records','value'])if(k in data){const r=findRows(data[k]);if(r.length)return r}for(const v of Object.values(data)){if(v&&typeof v==='object'){const r=findRows(v);if(r.length)return r}}}return []}
function sessionName(r){const s=clean(r.sessionName).toLowerCase();if(s.includes('sang'))return 'Sáng';if(s.includes('chieu'))return 'Chiều';if(s.includes('toi'))return 'Tối';const n=Number(r.session);return n===0?'Sáng':n===1?'Chiều':n===2?'Tối':clean(r.sessionName)||'Chưa rõ ca'}
function periods(r){const a=Number(r.startPeriod),b=Number(r.endPeriod);if(a>0&&b>=a)return `Tiết ${a}${b!==a?'-'+b:''}`;return `${Math.max(1,Number(r.periodCount)||1)} tiết`}
function subject(r){const s=clean(r.subjectName);if(!s)return clean(r.title)|| (r.isActivitySchedule?'Hoạt động':'Chưa có tên môn');if(r.isExamSchedule)return 'Thi '+s;if(r.isActivitySchedule)return s;return `${s} (${clean(r.classTypeName)||(Number(r.lessonType)===1?'TH':'LT')})`}
function normalizeRows(raw){return raw.filter(r=>r&&typeof r==='object'&&!r.isPlannedOnly).map(r=>({...r,_date:clean(r.date).slice(0,10),_class:clean(r.className)||'Chưa phân lớp',_subject:subject(r),_session:sessionName(r),_periods:periods(r),_priority:/\b19d\b/i.test(clean(r.className))})).filter(r=>/^\d{4}-\d{2}-\d{2}$/.test(r._date))}
function setStatus(text,bad=false,loading=false){$('status').innerHTML=(loading?'<span class="spinner"></span>':'')+text;$('dot').classList.toggle('bad',bad)}
function render(){
  const f=norm($('filter').value);const week=monday($('date').value);const end=addDays(week,6);
  const filtered=rows.filter(r=>r._date>=week&&r._date<=end&&(!f||[r._class,r._subject,r.teacherName,r.room,r.sessionName].some(v=>norm(v).includes(f))));
  filtered.sort((a,b)=>a._date.localeCompare(b._date)||Number(a.session)-Number(b.session)||Number(a.startPeriod)-Number(b.startPeriod)||a._class.localeCompare(b._class,'vi'));
  $('weekLabel').textContent=fmtDate(week)+' - '+fmtDate(end);
  $('count').textContent=`${filtered.length} lịch học${f?' · Lọc: '+$('filter').value:''}`;
  const root=$('results');root.innerHTML='';
  if(!filtered.length){root.innerHTML='<div class="empty"><strong>Không có lịch phù hợp</strong>Thử xóa bộ lọc hoặc chọn tuần khác.</div>';return}
  for(let i=0;i<7;i++){
    const day=addDays(week,i),list=filtered.filter(r=>r._date===day);if(!list.length)continue;
    const d=new Date(day+'T12:00:00');
    const box=document.createElement('article');box.className='day-group';
    
    const head=document.createElement('div');head.className='day-head';
    const title=document.createElement('div');title.className='day-title';title.textContent=['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'][d.getDay()];
    const date=document.createElement('div');date.className='day-date';date.textContent=fmtDate(day);
    head.append(title,date);box.append(head);
    
    const items=document.createElement('div');items.className='day-items';
    for(const r of list){
      const item=document.createElement('div');item.className='item'+(r._priority?' priority':'');
      
      const time=document.createElement('div');time.className='item-time';
      const ses=document.createElement('span');ses.className='item-session';ses.textContent=r._session;
      const per=document.createElement('span');per.className='item-periods';per.textContent=r._periods;
      time.append(ses,per);
      
      const content=document.createElement('div');content.className='item-content';
      
      const header=document.createElement('div');header.className='item-header';
      const name=document.createElement('div');name.className='item-subject';name.textContent=r._subject;
      const cls=document.createElement('div');cls.className='item-class';cls.textContent=r._class;
      header.append(name,cls);
      
      const details=document.createElement('div');details.className='item-details';
      if(clean(r.teacherName)){const gv=document.createElement('span');gv.textContent='GV: '+clean(r.teacherName);details.append(gv)}
      if(clean(r.room)||clean(r.classTypeName)){
          const rm=document.createElement('span');
          const p=[];if(clean(r.room))p.push('Phòng: '+clean(r.room));if(clean(r.classTypeName))p.push(clean(r.classTypeName));
          rm.textContent=p.join(' · ');details.append(rm)
      }
      
      content.append(header,details);
      item.append(time,content);items.append(item);
    }
    box.append(items);root.append(box);
  }
}
async function load(){
  if(busy)return;busy=true;$('load').disabled=true;setStatus('Đang đọc dữ liệu',false,true);$('notice').classList.remove('error');
  const selected=$('date').value||'2026-11-06';const start=monday(selected);
  try{
    const snapshot=await getSnapshot(start);const raw=findRows(snapshot.data);lastRaw=raw;rows=normalizeRows(raw);render();
    const fetched=snapshot.fetchedAt?new Date(snapshot.fetchedAt).toLocaleString('vi-VN'):'không rõ';
    $('notice').textContent=`Đã tải ${rows.length} lịch · Đồng bộ: ${fetched}.`;
    setStatus('Đã kết nối');
  }catch(e){
    const msg=e.message||'Lỗi không xác định.';
    $('notice').textContent=msg;$('notice').classList.add('error');setStatus('Chưa có dữ liệu',true);
    if(!rows.length)$('results').innerHTML='<div class="empty"><strong>Chưa tải được thời khóa biểu</strong>'+msg+'</div>';
  }finally{busy=false;$('load').disabled=false}
}
function schedule(){if(timer)clearInterval(timer);if(autoOn)timer=setInterval(load,300000)}
$('load').addEventListener('click',load);$('date').addEventListener('change',load);$('filter').addEventListener('input',render);
$('prev').addEventListener('click',()=>{$('date').value=addDays(monday($('date').value),-7);load()});
$('next').addEventListener('click',()=>{$('date').value=addDays(monday($('date').value),7);load()});
$('auto').addEventListener('click',()=>{autoOn=!autoOn;$('auto').textContent='Tự cập nhật: '+(autoOn?'BẬT':'TẮT');schedule();if(autoOn)load()});
$('csv').addEventListener('click',()=>{
  const f=norm($('filter').value),week=monday($('date').value),end=addDays(week,6);
  const list=rows.filter(r=>r._date>=week&&r._date<=end&&(!f||[r._class,r._subject,r.teacherName,r.room].some(v=>norm(v).includes(f))));
  if(!list.length){alert('Không có dữ liệu để xuất.');return}
  const q=v=>'"'+clean(v).replace(/"/g,'""')+'"';
  const lines=[['Ngày','Lớp','Ca','Tiết','Môn học','Giảng viên','Phòng'].map(q).join(','),...list.map(r=>[r._date,r._class,r._session,r._periods,r._subject,r.teacherName,r.room].map(q).join(','))];
  const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='thoi-khoa-bieu-'+week+'.csv';a.click();URL.revokeObjectURL(url);
});
schedule();load();
})();
</script>
</body>
</html>
