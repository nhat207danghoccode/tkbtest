<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#4f46e5">
<title>Thời khóa biểu · CĐ Y tế Hà Tĩnh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== DESIGN TOKENS ===== */
:root {
  --primary: #6366f1;
  --primary-dark: #4f46e5;
  --primary-glow: rgba(99,102,241,.22);
  --primary-light: #eef2ff;
  --accent: #0d9488;
  --accent-light: #ccfbf1;
  --accent-glow: rgba(13,148,136,.22);
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;

  --bg: #f0f2f8;
  --bg-grain: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.025'/%3E%3C/svg%3E");
  --surface: #ffffff;
  --surface-raised: #ffffff;
  --surface-glass: rgba(255,255,255,.78);
  --surface-border: rgba(148,163,184,.22);
  --surface-hover: #f8fafc;

  --text: #0f172a;
  --text-secondary: #475569;
  --muted: #94a3b8;

  --shadow-xs: 0 1px 2px rgba(15,23,42,.04);
  --shadow-sm: 0 1px 3px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
  --shadow-md: 0 4px 16px rgba(15,23,42,.08);
  --shadow-lg: 0 12px 40px rgba(15,23,42,.10);
  --shadow-glow: 0 0 0 3px var(--primary-glow);

  --radius-xl: 20px;
  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-sm: 8px;
  --radius-full: 9999px;
  --ease: cubic-bezier(.16,1,.3,1);
  --dur: .28s;
}

[data-theme="dark"] {
  --bg: #0b0f1a;
  --surface: #151c2e;
  --surface-raised: #1a2238;
  --surface-glass: rgba(21,28,46,.82);
  --surface-border: rgba(100,116,139,.2);
  --surface-hover: #1e293b;
  --text: #f1f5f9;
  --text-secondary: #cbd5e1;
  --muted: #64748b;
  --primary-light: rgba(99,102,241,.14);
  --accent-light: rgba(13,148,136,.14);
  --shadow-xs: 0 1px 2px rgba(0,0,0,.3);
  --shadow-sm: 0 2px 6px rgba(0,0,0,.35);
  --shadow-md: 0 6px 20px rgba(0,0,0,.45);
  --shadow-lg: 0 16px 48px rgba(0,0,0,.5);
}

/* ===== RESET & BASE ===== */
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background: var(--bg);
  background-image: var(--bg-grain);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  line-height: 1.55;
  min-height: 100vh;
  transition: background .35s ease, color .2s ease;
  overflow-x: hidden;
}

/* ===== LAYOUT ===== */
.wrap { max-width: 880px; margin: 0 auto; padding: 16px 16px 96px; }

/* ===== ANIMATED BACKGROUND BLOBS ===== */
body::before, body::after {
  content: "";
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  opacity: .35;
  pointer-events: none;
  z-index: 0;
  animation: blobFloat 18s ease-in-out infinite alternate;
}
body::before {
  width: 420px; height: 420px;
  background: var(--primary);
  top: -120px; left: -100px;
}
body::after {
  width: 360px; height: 360px;
  background: var(--accent);
  bottom: -80px; right: -80px;
  animation-delay: -9s;
  animation-direction: alternate-reverse;
}
[data-theme="dark"] body::before,
[data-theme="dark"] body::after { opacity: .12; }
@keyframes blobFloat {
  0%   { transform: translate(0,0) scale(1); }
  50%  { transform: translate(30px,20px) scale(1.08); }
  100% { transform: translate(-15px,35px) scale(.95); }
}

.wrap { position: relative; z-index: 1; }

/* ===== HEADER ===== */
.top-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 2px 22px;
}
.brand-group { display: flex; align-items: center; gap: 14px; }
.brand-icon {
  width: 48px; height: 48px;
  border-radius: 15px;
  background: linear-gradient(135deg, var(--primary) 0%, #06b6d4 100%);
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  box-shadow: 0 6px 20px var(--primary-glow);
  flex-shrink: 0;
  transition: transform var(--dur) var(--ease);
}
.brand-icon:hover { transform: rotate(-6deg) scale(1.08); }
.brand-text { display: flex; flex-direction: column; }
.brand-title {
  font-size: 22px; font-weight: 800;
  letter-spacing: -.03em; color: var(--text); line-height: 1.15;
}
.brand-sub {
  font-size: 11px; font-weight: 700;
  color: var(--accent); text-transform: uppercase;
  letter-spacing: .07em; margin-top: 2px;
}
.header-actions { display: flex; align-items: center; gap: 8px; }

/* Icon buttons */
.icon-btn {
  background: var(--surface-glass);
  backdrop-filter: blur(10px);
  border: 1px solid var(--surface-border);
  color: var(--text-secondary);
  width: 40px; height: 40px;
  border-radius: var(--radius-full);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all var(--dur) var(--ease);
}
.icon-btn:hover { background: var(--surface-hover); color: var(--text); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { width: 18px; height: 18px; }

/* Status indicator */
.status-badge {
  display: flex; align-items: center; gap: 7px;
  font-size: 11.5px; font-weight: 700; color: var(--text-secondary);
  background: var(--surface-glass);
  backdrop-filter: blur(10px);
  padding: 7px 14px; border-radius: var(--radius-full);
  border: 1px solid var(--surface-border);
  box-shadow: var(--shadow-xs);
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); box-shadow: 0 0 8px var(--success); }
.dot.loading { background: var(--warning); box-shadow: 0 0 8px var(--warning); animation: dotPulse 1s infinite alternate; }
.dot.error { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
@keyframes dotPulse { from{opacity:.35;transform:scale(.8)} to{opacity:1;transform:scale(1.2)} }

/* ===== CONTROL PANEL ===== */
.controls-panel {
  background: var(--surface-glass);
  backdrop-filter: blur(16px);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-xl);
  padding: 18px;
  box-shadow: var(--shadow-md);
  margin-bottom: 22px;
  display: flex; flex-direction: column; gap: 14px;
}

/* Row 1: Week nav + Search */
.ctrl-row-1 {
  display: flex; flex-direction: column; gap: 10px;
}

/* Week Nav Bar */
.week-nav {
  display: flex; align-items: center;
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-full);
  padding: 4px;
  box-shadow: var(--shadow-xs);
  gap: 2px;
}
.nav-arrow {
  background: transparent; border: none;
  width: 40px; height: 40px;
  border-radius: var(--radius-full);
  color: var(--text-secondary);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all var(--dur) var(--ease);
  flex-shrink: 0;
}
.nav-arrow:hover { background: var(--primary-light); color: var(--primary); }
.nav-arrow:active { transform: scale(.9); }
.nav-arrow svg { width: 17px; height: 17px; }

/* Centre clickable week badge */
.week-center {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px;
  cursor: pointer;
  padding: 5px 10px;
  border-radius: var(--radius-full);
  transition: background var(--dur) var(--ease);
  position: relative;
  user-select: none;
}
.week-center:hover { background: var(--primary-light); }

.week-badge {
  background: linear-gradient(135deg, var(--primary) 0%, #818cf8 100%);
  color: #fff;
  font-size: 12.5px; font-weight: 800;
  padding: 4px 12px;
  border-radius: var(--radius-full);
  letter-spacing: -.01em;
  box-shadow: 0 3px 10px var(--primary-glow);
  white-space: nowrap;
  display: inline-flex; align-items: center; gap: 5px;
  transition: transform var(--dur) var(--ease);
}
.week-center:hover .week-badge { transform: scale(1.04); }
.week-this-label {
  font-size: 9px; font-weight: 800;
  background: rgba(255,255,255,.28);
  padding: 1px 5px;
  border-radius: 4px;
  text-transform: uppercase;
}
.date-range {
  font-weight: 700; font-size: 13px;
  color: var(--text); letter-spacing: -.01em;
  white-space: nowrap;
}

/* ===== CUSTOM WEEK PICKER POPUP ===== */
.week-picker-overlay {
  position: fixed; inset: 0;
  background: rgba(15,23,42,.35);
  backdrop-filter: blur(4px);
  z-index: 999;
  opacity: 0;
  pointer-events: none;
  transition: opacity .22s ease;
}
.week-picker-overlay.open { opacity: 1; pointer-events: auto; }

.week-picker {
  position: fixed;
  left: 50%; top: 50%;
  transform: translate(-50%,-50%) scale(.92);
  width: min(420px, calc(100vw - 32px));
  max-height: min(520px, calc(100vh - 100px));
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-lg);
  z-index: 1000;
  display: flex; flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transition: all .28s var(--ease);
  overflow: hidden;
}
.week-picker.open {
  opacity: 1;
  pointer-events: auto;
  transform: translate(-50%,-50%) scale(1);
}
.wp-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--surface-border);
}
.wp-title {
  font-size: 17px; font-weight: 800;
  color: var(--text); letter-spacing: -.02em;
}
.wp-close {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--surface-hover); border: none;
  color: var(--muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s ease;
}
.wp-close:hover { background: var(--danger); color: #fff; }
.wp-close svg { width: 16px; height: 16px; }

.wp-list {
  flex: 1; overflow-y: auto; padding: 10px 12px 16px;
  display: flex; flex-direction: column; gap: 4px;
}
.wp-list::-webkit-scrollbar { width: 5px; }
.wp-list::-webkit-scrollbar-thumb { background: var(--surface-border); border-radius: 5px; }

.wp-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 16px;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all .18s ease;
  border: 1.5px solid transparent;
  font-size: 13.5px;
  gap: 10px;
}
.wp-item:hover { background: var(--primary-light); }
.wp-item.active {
  background: var(--primary-light);
  border-color: var(--primary);
}
.wp-item.current .wp-item-num::after {
  content: "← Tuần này";
  font-size: 10px; font-weight: 700;
  color: var(--success);
  margin-left: 8px;
  text-transform: uppercase;
}
.wp-item-num {
  font-weight: 800; color: var(--text);
  display: flex; align-items: center;
}
.wp-item-dates {
  font-weight: 600; color: var(--muted); font-size: 12.5px;
  text-align: right;
}

/* ===== SEARCH ===== */
.search-box {
  display: flex; align-items: center;
  background: var(--surface);
  border: 1.5px solid var(--surface-border);
  border-radius: var(--radius-full);
  padding: 0 16px; height: 46px;
  box-shadow: var(--shadow-xs);
  transition: all var(--dur) var(--ease);
}
.search-box:focus-within {
  border-color: var(--primary);
  box-shadow: var(--shadow-glow);
}
.search-box svg.s-icon { width: 17px; height: 17px; color: var(--muted); margin-right: 10px; flex-shrink: 0; }
.search-box input {
  border: none; background: transparent; width: 100%; height: 100%;
  font-size: 14px; color: var(--text); outline: none;
  font-family: inherit; font-weight: 600;
}
.search-box input::placeholder { color: var(--muted); font-weight: 400; }
.clear-btn {
  background: transparent; border: none; color: var(--muted);
  cursor: pointer; padding: 4px; border-radius: 50%; display: none;
  transition: color .15s ease;
}
.clear-btn:hover { color: var(--danger); }

/* Row 2: Quick actions bar */
.ctrl-row-2 {
  display: flex; flex-wrap: wrap; align-items: center;
  justify-content: space-between; gap: 8px;
  padding-top: 10px;
  border-top: 1px solid var(--surface-border);
}
.quick-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }

.chip {
  background: var(--surface);
  border: 1.5px solid var(--surface-border);
  color: var(--text-secondary);
  font-size: 12px; font-weight: 700;
  padding: 6px 13px;
  border-radius: var(--radius-full);
  cursor: pointer;
  transition: all var(--dur) var(--ease);
  display: inline-flex; align-items: center; gap: 5px;
  user-select: none;
}
.chip:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
.chip:active { transform: scale(.95); }
.chip.active {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
  box-shadow: 0 3px 12px var(--primary-glow);
}
.chip.today-chip {
  background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
  border-color: #86efac;
  color: #166534; font-weight: 800;
}
[data-theme="dark"] .chip.today-chip {
  background: linear-gradient(135deg, rgba(16,185,129,.12), rgba(16,185,129,.2));
  border-color: rgba(16,185,129,.4); color: #6ee7b7;
}
.chip.today-chip:hover { border-color: #4ade80; }
.chip svg { width: 13px; height: 13px; }

/* Toggle switch */
.toggle-wrap {
  display: flex; align-items: center; gap: 8px;
  margin-left: auto; cursor: pointer; user-select: none;
}
.toggle-text { font-size: 11.5px; font-weight: 700; color: var(--muted); }
.toggle-track {
  position: relative; width: 38px; height: 22px;
  background: var(--surface-border); border-radius: 22px;
  transition: background var(--dur) var(--ease);
}
.toggle-track::after {
  content: ""; position: absolute; top: 3px; left: 3px;
  width: 16px; height: 16px; border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,.18);
  transition: transform var(--dur) var(--ease);
}
.toggle-track.on { background: var(--success); }
.toggle-track.on::after { transform: translateX(16px); }

/* ===== STATS BAR ===== */
.stats-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 6px 14px;
  font-size: 13px; font-weight: 700; color: var(--text-secondary);
}
.stats-bar .hl { color: var(--primary); }
.stats-bar .time-note { font-size: 11px; color: var(--muted); font-weight: 500; }

/* ===== SCHEDULE GRID ===== */
.grid { display: grid; grid-template-columns: 1fr; gap: 14px; }

/* ===== CARDS ===== */
.card {
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  display: flex; flex-direction: column;
  overflow: hidden; position: relative;
  transition: all var(--dur) var(--ease);
  animation: cardIn .45s var(--ease) both;
  animation-delay: calc(var(--i,0) * .04s);
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
  border-color: rgba(99,102,241,.25);
}
@keyframes cardIn {
  from { opacity:0; transform: translateY(18px) scale(.97); }
  to   { opacity:1; transform: translateY(0) scale(1); }
}

.card-head {
  padding: 12px 18px;
  border-bottom: 1px solid var(--surface-border);
  display: flex; justify-content: space-between; align-items: center;
  background: var(--surface-hover);
}
[data-theme="dark"] .card-head { background: rgba(30,41,59,.3); }
.day-info { display: flex; align-items: center; gap: 8px; }
.day-name { font-weight: 800; font-size: 13.5px; color: var(--text); }
.day-date { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.today-badge {
  background: linear-gradient(135deg, #f59e0b, #ef4444);
  color: #fff; font-size: 9.5px; font-weight: 800;
  text-transform: uppercase; padding: 2px 8px;
  border-radius: var(--radius-full); letter-spacing: .04em;
  box-shadow: 0 2px 8px rgba(239,68,68,.3);
  animation: dotPulse 2s infinite alternate;
}
.session-pill {
  font-size: 11px; font-weight: 800; text-transform: uppercase;
  padding: 3px 10px; border-radius: var(--radius-full); letter-spacing: .03em;
}
.session-pill.sang  { background: #fef3c7; color: #b45309; }
.session-pill.chieu { background: #dbeafe; color: #1d4ed8; }
.session-pill.toi   { background: #f3e8ff; color: #7e22ce; }
[data-theme="dark"] .session-pill.sang  { background: rgba(245,158,11,.15); color: #fcd34d; }
[data-theme="dark"] .session-pill.chieu { background: rgba(59,130,246,.15); color: #93c5fd; }
[data-theme="dark"] .session-pill.toi   { background: rgba(168,85,247,.15); color: #d8b4fe; }

.card-body { display: flex; flex: 1; }
.col-time {
  flex: 0 0 88px; padding: 18px 10px;
  border-right: 1px solid var(--surface-border);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; gap: 6px;
  background: var(--surface-hover);
}
[data-theme="dark"] .col-time { background: rgba(15,23,42,.25); }
.clock-icon { width: 16px; height: 16px; color: var(--muted); }
.period-tag {
  font-size: 12px; font-weight: 800;
  color: var(--primary); background: var(--primary-light);
  padding: 4px 10px; border-radius: var(--radius-sm);
}

.col-content {
  flex: 1; padding: 16px 18px; min-width: 0;
  display: flex; flex-direction: column; gap: 10px;
}
.subject {
  font-size: 15px; font-weight: 800; line-height: 1.4;
  color: var(--text); letter-spacing: -.01em;
}
.meta { display: flex; flex-direction: column; gap: 5px; }
.info-row {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--text-secondary); font-weight: 500;
}
.info-row svg { flex-shrink: 0; width: 14px; height: 14px; color: var(--muted); }
.card-foot { display: flex; align-items: center; margin-top: auto; padding-top: 8px; }
.class-badge {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--primary-light); color: var(--primary-dark);
  font-size: 11px; font-weight: 800; padding: 4px 10px;
  border-radius: var(--radius-full); letter-spacing: .02em;
}

/* Priority card (19D) */
.card.priority {
  border-color: rgba(94,234,212,.6);
  box-shadow: 0 0 0 1px rgba(94,234,212,.4), var(--shadow-sm);
}
.card.priority .card-head {
  background: rgba(240,253,250,.7);
  border-bottom-color: #ccfbf1;
}
[data-theme="dark"] .card.priority .card-head {
  background: rgba(13,148,136,.12);
  border-bottom-color: rgba(13,148,136,.25);
}
.card.priority .class-badge {
  background: var(--accent-light); color: #0f766e;
  box-shadow: 0 2px 8px var(--accent-glow);
}
.priority-star { color: #f59e0b; width: 12px; height: 12px; }

/* ===== SKELETON ===== */
.skel {
  height: 130px; background: var(--surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--surface-border);
  position: relative; overflow: hidden;
}
.skel::after {
  content: ""; position: absolute; inset: 0;
  transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
  animation: shimmer 1.4s infinite;
}
[data-theme="dark"] .skel::after {
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.06), transparent);
}
@keyframes shimmer { to { transform: translateX(100%); } }

/* ===== EMPTY STATE ===== */
.empty-state {
  text-align: center; padding: 56px 20px;
  background: var(--surface-glass); backdrop-filter: blur(8px);
  border: 1.5px dashed var(--surface-border);
  border-radius: var(--radius-xl);
  display: flex; flex-direction: column;
  align-items: center; gap: 14px;
  animation: cardIn .3s ease both;
}
.empty-state svg.big { width: 56px; height: 56px; color: var(--muted); opacity: .5; }
.empty-state .title { font-size: 17px; font-weight: 800; color: var(--text); }
.empty-state .desc { font-size: 13px; color: var(--muted); max-width: 300px; line-height: 1.6; }

/* ===== RESPONSIVE ===== */
@media (min-width: 768px) {
  .wrap { padding: 32px 24px 80px; }
  .ctrl-row-1 { flex-direction: row; align-items: center; }
  .week-nav { flex: 1.2; }
  .search-box { flex: 1; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; }
}
</style>
</head>
<body>

<main class="wrap">

<!-- HEADER -->
<header class="top-header">
  <div class="brand-group">
    <div class="brand-icon">
      <svg width="26" height="26" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
    </div>
    <div class="brand-text">
      <h1 class="brand-title">Thời khóa biểu</h1>
      <span class="brand-sub">CĐ Y tế Hà Tĩnh</span>
    </div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="themeBtn" title="Sáng / Tối">
      <svg id="themeIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
    </button>
    <div class="status-badge">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">Đang kết nối</span>
    </div>
  </div>
</header>

<!-- CONTROLS -->
<section class="controls-panel">
  <div class="ctrl-row-1">
    <!-- WEEK NAV -->
    <div class="week-nav">
      <button class="nav-arrow" id="prevWeek" title="Tuần trước">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
      </button>

      <!-- Click mở custom popup, KHÔNG dùng <select> hệ thống -->
      <div class="week-center" id="weekCenterBtn" title="Bấm để chọn tuần nhanh">
        <span class="week-badge" id="weekBadge">Tuần 13</span>
        <span class="date-range" id="dateRange">26/10 - 01/11/2026</span>
      </div>

      <button class="nav-arrow" id="nextWeek" title="Tuần kế tiếp">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>

    <!-- SEARCH -->
    <div class="search-box">
      <svg class="s-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input id="filter" value="19D" placeholder="Tìm kiếm môn, giảng viên, phòng, lớp…">
      <button class="clear-btn" id="clearSearch">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg>
      </button>
    </div>
  </div>

  <div class="ctrl-row-2">
    <div class="quick-actions">
      <button class="chip today-chip" id="btnToday">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        Hôm nay · Tuần 13
      </button>
      <button class="chip active" data-filter="19D">Lớp 19D</button>
      <button class="chip" data-filter="sang">☀ Sáng</button>
      <button class="chip" data-filter="chieu">🌤 Chiều</button>
      <button class="chip" data-filter="">Tất cả</button>
    </div>
    <div class="toggle-wrap" id="autoToggle" title="Tự cập nhật mỗi 5 phút">
      <span class="toggle-text">Tự động</span>
      <div class="toggle-track on" id="autoSwitch"></div>
    </div>
  </div>
</section>

<!-- STATS BAR -->
<div class="stats-bar">
  <span id="countBadge">Đang chuẩn bị…</span>
  <span class="time-note" id="updateTime"></span>
</div>

<!-- SCHEDULE GRID -->
<section class="grid" id="results"></section>

</main>

<!-- ===== CUSTOM WEEK PICKER POPUP ===== -->
<div class="week-picker-overlay" id="wpOverlay"></div>
<div class="week-picker" id="wpPanel">
  <div class="wp-header">
    <span class="wp-title">Chọn tuần học</span>
    <button class="wp-close" id="wpClose">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="wp-list" id="wpList">
    <!-- Rendered by JS -->
  </div>
</div>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);

// ===== ANCHOR: Tuần 13 = Thứ Hai 2026-10-26 =====
const ANCHOR_MON = '2026-10-26';
const ANCHOR_WEEK = 13;
const TOTAL_WEEKS = 30; // Tuần 1..30

// Helpers
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const clean=v=>(v??'').toString().replace(/\s+/g,' ').trim();
const norm=v=>clean(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase();
const fmtFull=v=>{const[y,m,d]=v.split('-');return `${d}/${m}/${y}`};
const fmtShort=v=>{const[,m,d]=v.split('-');return `${d}/${m}`};
const addDays=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
const getMonday=d=>{const x=new Date(d+'T12:00:00'),day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
const weekNum=mon=>{const a=new Date(ANCHOR_MON+'T12:00:00'),b=new Date(mon+'T12:00:00');return ANCHOR_WEEK+Math.round((b-a)/(7*864e5))};
const monOfWeek=w=>addDays(ANCHOR_MON,(w-ANCHOR_WEEK)*7);

let currentDate=today(), rows=[], busy=false, autoOn=true, timer=null;
const currentWeekNum=()=>weekNum(getMonday(today()));

// ===== THEME =====
(function initTheme(){
  const t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  document.documentElement.setAttribute('data-theme',t);
  syncThemeIcon(t);
})();
function syncThemeIcon(t){
  $('themeIcon').innerHTML = t==='dark'
    ? '<circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2" fill="none"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 1v2m0 18v2m11-11h-2M3 12H1m16.364-7.364l-1.414 1.414M6.05 17.95l-1.414 1.414m12.728 0l-1.414-1.414M6.05 6.05L4.636 4.636"/>'
    : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>';
}
$('themeBtn').onclick=()=>{
  const next=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('theme',next);
  syncThemeIcon(next);
};

// ===== WEEK PICKER POPUP (thay thế <select> hệ thống) =====
function buildPickerList(){
  const list=$('wpList');
  list.innerHTML='';
  const curMon=getMonday(currentDate);
  const thisWeek=currentWeekNum();
  for(let w=1;w<=TOTAL_WEEKS;w++){
    const mon=monOfWeek(w), sun=addDays(mon,6);
    const item=document.createElement('div');
    item.className='wp-item'+(mon===curMon?' active':'')+(w===thisWeek?' current':'');
    item.innerHTML=`<span class="wp-item-num">Tuần ${w}</span><span class="wp-item-dates">${fmtShort(mon)} → ${fmtShort(sun)}</span>`;
    item.onclick=()=>{currentDate=mon;closeWP();load()};
    list.appendChild(item);
  }
  // Scroll vào item active
  requestAnimationFrame(()=>{
    const active=list.querySelector('.wp-item.active');
    if(active) active.scrollIntoView({block:'center',behavior:'auto'});
  });
}
function openWP(){ buildPickerList(); $('wpOverlay').classList.add('open'); $('wpPanel').classList.add('open'); }
function closeWP(){ $('wpOverlay').classList.remove('open'); $('wpPanel').classList.remove('open'); }
$('weekCenterBtn').onclick=openWP;
$('wpOverlay').onclick=closeWP;
$('wpClose').onclick=closeWP;

// ===== DATA FETCH =====
async function getSnapshot(weekStart){
  const url=`./data/week-${weekStart}.json?v=${Date.now()}`;
  let r; try{r=await fetch(url,{cache:'no-store'})}catch{throw new Error('Mất kết nối mạng.')}
  if(!r.ok)throw Object.assign(new Error('Chưa có dữ liệu tuần này.'),{status:r.status});
  const s=await r.json();
  if(!s||s.ok!==true)throw new Error(s?.error||'Lỗi dữ liệu.');
  return s;
}
function findRows(data){if(Array.isArray(data)){if(data.some(x=>x&&typeof x==='object'&&('subjectName'in x||'className'in x||'startPeriod'in x)))return data;for(const x of data){const r=findRows(x);if(r.length)return r}return []}if(data&&typeof data==='object'){for(const k of['items','data','results','schedules','generalSchedules','records','value'])if(k in data){const r=findRows(data[k]);if(r.length)return r}for(const v of Object.values(data)){if(v&&typeof v==='object'){const r=findRows(v);if(r.length)return r}}}return []}
function sessionName(r){const s=clean(r.sessionName).toLowerCase();if(s.includes('sang'))return 'Sáng';if(s.includes('chieu'))return 'Chiều';if(s.includes('toi'))return 'Tối';const n=Number(r.session);return n===0?'Sáng':n===1?'Chiều':n===2?'Tối':clean(r.sessionName)||'Chưa rõ'}
function periods(r){const a=Number(r.startPeriod),b=Number(r.endPeriod);if(a>0&&b>=a)return `Tiết ${a}${b!==a?' – '+b:''}`;return `${Math.max(1,Number(r.periodCount)||1)} tiết`}
function subject(r){const s=clean(r.subjectName);if(!s)return clean(r.title)||(r.isActivitySchedule?'Hoạt động sinh hoạt':'Chưa có tên');if(r.isExamSchedule)return 'Thi '+s;if(r.isActivitySchedule)return s;return `${s} (${clean(r.classTypeName)||(Number(r.lessonType)===1?'TH':'LT')})`}
function normalizeRows(raw){return raw.filter(r=>r&&typeof r==='object'&&!r.isPlannedOnly).map(r=>({...r,_date:clean(r.date).slice(0,10),_class:clean(r.className)||'Chưa phân lớp',_subject:subject(r),_session:sessionName(r),_periods:periods(r),_priority:/\b19d\b/i.test(clean(r.className))})).filter(r=>/^\d{4}-\d{2}-\d{2}$/.test(r._date))}

function setStatus(text,state='ok'){$('statusText').textContent=text;$('statusDot').className='dot '+state}
function showSkeleton(){$('results').innerHTML=Array(4).fill('<div class="skel"></div>').join('')}

// ===== RENDER =====
function render(){
  const f=norm($('filter').value);
  $('clearSearch').style.display=$('filter').value?'block':'none';
  document.querySelectorAll('.chip[data-filter]').forEach(c=>c.classList.toggle('active',c.dataset.filter===$('filter').value));

  const mon=getMonday(currentDate), sun=addDays(mon,6), todayStr=today();
  const wn=weekNum(mon), isThis=mon===getMonday(todayStr);

  // Update header badge
  $('weekBadge').innerHTML=`Tuần ${wn}`+(isThis?` <span class="week-this-label">Tuần này</span>`:'');
  $('dateRange').textContent=`${fmtShort(mon)} – ${fmtFull(sun)}`;

  const filtered=rows.filter(r=>r._date>=mon&&r._date<=sun&&(!f||[r._class,r._subject,r.teacherName,r.room,r.sessionName,r._session].some(v=>norm(v).includes(f))));
  filtered.sort((a,b)=>a._date.localeCompare(b._date)||Number(a.session)-Number(b.session)||Number(a.startPeriod)-Number(b.startPeriod));

  $('countBadge').innerHTML=`Tuần <strong>${wn}</strong> · <strong class="hl">${filtered.length}</strong> lịch học`;

  const root=$('results'); root.innerHTML='';
  if(!filtered.length){
    root.innerHTML=`<div class="empty-state">
      <svg class="big" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      <div class="title">Trống lịch Tuần ${wn}</div>
      <div class="desc">Không có lịch học phù hợp. Thử chuyển tuần khác hoặc thay đổi bộ lọc.</div>
    </div>`;
    return;
  }

  const dayNames=['CN','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'];
  filtered.forEach((r,idx)=>{
    const d=new Date(r._date+'T12:00:00');
    const isToday=r._date===todayStr;
    const sc=norm(r._session);

    const card=document.createElement('article');
    card.className='card'+(r._priority?' priority':'');
    card.style.setProperty('--i',idx);

    card.innerHTML=`
      <div class="card-head">
        <div class="day-info">
          <span class="day-name">${dayNames[d.getDay()]}</span>
          <span class="day-date">${fmtFull(r._date)}</span>
          ${isToday?'<span class="today-badge">Hôm nay</span>':''}
        </div>
        <span class="session-pill ${sc}">${r._session}</span>
      </div>
      <div class="card-body">
        <div class="col-time">
          <svg class="clock-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <div class="period-tag">${r._periods}</div>
        </div>
        <div class="col-content">
          <div class="subject">${r._subject}</div>
          <div class="meta">
            ${clean(r.teacherName)?`<div class="info-row"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg><span>${clean(r.teacherName)}</span></div>`:''}
            ${clean(r.room)?`<div class="info-row"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a2 2 0 01-2.828 0l-4.243-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg><span>Phòng ${clean(r.room)}</span></div>`:''}
          </div>
          <div class="card-foot">
            <span class="class-badge">
              ${r._priority?'<svg class="priority-star" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>':''}
              ${r._class}
            </span>
          </div>
        </div>
      </div>`;
    root.appendChild(card);
  });
}

// ===== LOAD DATA =====
async function load(){
  if(busy)return; busy=true;
  setStatus('Đang tải…','loading');
  showSkeleton();
  const mon=getMonday(currentDate);
  try{
    const snap=await getSnapshot(mon);
    rows=normalizeRows(findRows(snap.data));
    render();
    setStatus('Đã cập nhật','ok');
    const n=new Date();
    $('updateTime').textContent=`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
  }catch(e){
    setStatus('Lỗi','error');
    $('results').innerHTML=`<div class="empty-state">
      <svg class="big" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
      <div class="title">Lỗi tải dữ liệu</div>
      <div class="desc">${e.message||'Kiểm tra kết nối mạng.'}</div>
    </div>`;
  }finally{busy=false}
}

function schedule(){if(timer)clearInterval(timer);if(autoOn)timer=setInterval(load,3e5)}

// ===== EVENTS =====
$('filter').addEventListener('input',render);
$('clearSearch').onclick=()=>{$('filter').value='';render();$('filter').focus()};
$('prevWeek').onclick=()=>{currentDate=addDays(getMonday(currentDate),-7);load()};
$('nextWeek').onclick=()=>{currentDate=addDays(getMonday(currentDate),7);load()};
$('btnToday').onclick=()=>{currentDate=today();load()};

document.querySelectorAll('.chip[data-filter]').forEach(c=>{
  c.onclick=()=>{$('filter').value=c.dataset.filter;render()};
});

$('autoToggle').onclick=()=>{
  autoOn=!autoOn;
  $('autoSwitch').className='toggle-track'+(autoOn?' on':'');
  schedule();
  if(autoOn)load();
};

// Keyboard shortcut: Escape đóng popup
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeWP()});

schedule();
load();
})();
</script>
</body>
</html>
