name: Update public timetable data

on:
  workflow_dispatch:
  schedule:
    - cron: '11,41 * * * *'

permissions:
  contents: write

concurrency:
  group: update-timetable-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Fetch timetable snapshots
        run: python scripts/fetch_schedule.py

      - name: Commit updated JSON snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update public timetable data"
            git push
          fi
